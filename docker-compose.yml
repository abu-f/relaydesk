name: relaydesk

services:
  volume-init:
    image: alpine:3.21
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - opencode_data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  opencode-proxy:
    build: .
    depends_on:
      volume-init:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      WEB_DIR: /app/web/dist
      DATABASE_PATH: /data/app.db
      PORT: 8080
      MIHOMO_CONFIG_PATH: /mihomo/config.yaml
    volumes:
      - opencode_data:/data
      - ./mihomo/config.yaml:/mihomo/config.yaml
    # The host config bind mount must be writable by the container user.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  opencode_data:
